name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install PowerShell test tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Build binary module
        shell: pwsh
        run: .\build.ps1 -Clean

      - name: Run xUnit tests
        shell: pwsh
        run: dotnet test .\tests\OfficeScrubC2R.Core.Tests\OfficeScrubC2R.Core.Tests.csproj -c Release

      - name: Run Pester module tests
        shell: pwsh
        run: Invoke-Pester -Path .\tests\OfficeScrubC2R.Tests.ps1 -CI

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($results.Count) issue(s)."
          }

      - name: Validate module in PowerShell 7
        shell: pwsh
        run: .\.github\scripts\Validate-Module.ps1 -SkipBuild

      - name: Validate module in Windows PowerShell
        shell: powershell
        run: |
          Import-Module .\OfficeScrubC2R.psd1 -Force
          $expected = @('Get-InstalledOfficeProducts', 'Invoke-OfficeScrubC2R', 'Test-OfficeC2RState')
          $actual = Get-Command -Module OfficeScrubC2R | Select-Object -ExpandProperty Name | Sort-Object
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
            throw "Unexpected command exports. Expected: $($expected -join ', '); Actual: $($actual -join ', ')"
          }
          Test-OfficeC2RState | Out-Null

      - name: Verify source hygiene
        shell: pwsh
        run: |
          $trackedBinaries = @(git ls-files '*.dll' '*.pdb' | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
          if ($trackedBinaries.Count -gt 0) {
            throw "Compiled binaries must not be tracked: $($trackedBinaries -join ', ')"
          }

          $pathRewriteMatches = Get-ChildItem .\src -Recurse -File -Filter *.cs |
            Select-String -Pattern 'GetWow64Key|Wow6432Node'
          if ($pathRewriteMatches) {
            $pathRewriteMatches | Format-Table -AutoSize
            throw 'Registry view handling in src/ must use RegistryView, not manual Wow6432Node path rewriting.'
          }

          if (-not (Test-Path .\artifacts\checksums.sha256 -PathType Leaf)) {
            throw 'Checksum file was not generated.'
          }
